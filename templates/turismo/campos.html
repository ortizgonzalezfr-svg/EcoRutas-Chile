{% if formulario.non_field_errors %}<div class="alert alert-danger">{{ formulario.non_field_errors }}</div>{% endif %}
{% for campo in formulario %}<div class="mb-3">{{ campo.label_tag }}{{ campo }}{% if campo.help_text %}<div class="form-text">{{ campo.help_text|safe }}</div>{% endif %}{% for error in campo.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>{% endfor %}
