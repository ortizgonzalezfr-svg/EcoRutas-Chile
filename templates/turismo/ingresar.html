{% extends 'base.html' %}{% block contenido %}<div class="panel formulario-corto mx-auto"><p class="etiqueta text-success">CONTINÚA TU AVENTURA</p><h1 class="h2">Iniciar sesión</h1><form method="post">{% csrf_token %}{% if form.errors %}<div class="alert alert-danger">Usuario o contraseña incorrectos.</div>{% endif %}<div class="mb-3"><label for="id_username" class="form-label">Nombre de usuario</label><input class="form-control" name="username" id="id_username" required autocomplete="username" value="{{ form.username.value|default:'' }}"></div><div class="mb-3"><label for="id_password" class="form-label">Contraseña</label><input class="form-control" type="password" name="password" id="id_password" required autocomplete="current-password"></div><input type="hidden" name="next" value="{{ next }}"><button class="btn btn-success w-100">Ingresar</button></form><p class="mt-3 mb-0">¿Primera visita? <a href="{% url 'registro' %}">Crear cuenta</a></p></div>{% endblock %}
